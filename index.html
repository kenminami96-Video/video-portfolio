<!DOCTYPE html>

<style>

  background: #f7f7f7;

}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 30px;
}

header {
  margin-bottom: 100px;
}

h1 {

}

h2 {

  margin-bottom: 15px;
}

p {
  line-height: 1.8;
  color: #555;
}


/* 動画一覧 */

.works {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 60px 40px;
}


.video iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
}


.video h2 {
  margin-top: 20px;
}


/* スマホ対応 */

@media(max-width:700px){

.container {
  padding: 50px 20px;
}

h1 {
  font-size: 36px;
}

.works {
  grid-template-columns: 1fr;
}

}

</style>

</head>
