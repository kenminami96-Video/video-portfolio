<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Portfolio | 南 健一</title>

<style>

body {
  margin: 0;
  background: #fafafa;
  color: #222;
  font-family:"Noto Sans JP", sans-serif;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 30px;
}

header {
  padding: 50px 0 70px;
}

h1 {
  font-size: 56px;
  letter-spacing: 0.02em;
  margin: 0 0 45px;
}

h2 {
  font-size: 24px;
  margin-bottom: 15px;
}

p {
  line-height: 1.8;
  color: #555;
}

.lead {
  margin: 0;
}

.lead-main {
  font-size: 18px;
  line-height: 1.8;
  color: #555555;
  margin: 0;
}

.lead-sub {
  font-size: 16px;
  line-height: 1.8;
  color: #888888;
  margin: 8px 0 0;
}

.eyebrow {
  font-family: "Space Grotesk", sans-serif;
  font-size: 13px;
  letter-spacing: 0.25em;
  color: #E85D3F;
  margin: 0;
}
  
/* 動画一覧 */

.works {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 60px 40px;
}


.video {
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.04);
}

.video iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
}


.video h2 {
  margin: 20px 25px 10px;
}

.video p {
  margin: 0 25px 25px;
}


/* スマホ対応 */

@media(max-width:700px){

.container {
  padding: 50px 20px;
}

h1 {
  font-size: 36px;
}

.works {
  grid-template-columns: 1fr;
}

}

/* WORKS見出し */

.section-title {
  display: flex;
  align-items: center;
  gap: 40px;
  margin-bottom: 50px;
}

.section-title p {
  font-family: "Space Grotesk", sans-serif;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.25em;
  color: #E85D3F;
  margin: 0;
}

.section-title::after {
  content: "";
  height: 1px;
  background: #e5e5e5;
  flex: 1;
}


/* 動画カードカテゴリ */

.category {
  font-family: "Space Grotesk", sans-serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: #777777;
  margin: 20px 25px 0;
}

</style>

</head>


<body>


<div class="container">


<header>

<p class="eyebrow">
VIDEO CREATOR
</p>

<h1>
南 健一
</h1>

<div class="lead">
  <p class="lead-main">
    企業の目的に合わせた動画制作
  </p>

  <p class="lead-sub">
    企画から編集まで一貫対応
  </p>
</div>

</header>

<div class="section-title">
  <p>WORKS</p>
</div>

<section class="works">


<div class="video">

<iframe 
src="https://www.youtube.com/embed/uG7W3D-j6w8"
allowfullscreen>
</iframe>

<h2>
展示会動画
</h2>

<p>
展示会ブース向けの商品紹介動画。
</p>

</div>



<div class="video">

<iframe 
src="https://www.youtube.com/embed/Da6OSw7URB0"
allowfullscreen>
</iframe>

<h2>
サービス紹介動画
</h2>

<p>
企業サービスの魅力を伝える紹介動画。
</p>

</div>



<div class="video">

<iframe 
src="https://www.youtube.com/embed/UPyBy_UUngc"
allowfullscreen>
</iframe>

<h2>
採用動画
</h2>

<p>
企業の魅力を伝える採用向け動画。
</p>

</div>



<div class="video">

<iframe 
src="https://www.youtube.com/embed/alnDLDWcT7s"
allowfullscreen>
</iframe>

<h2>
会社紹介動画
</h2>

<p>
会社や事業を紹介する動画。
</p>

</div>


</section>


</div>


</body>

</html>
