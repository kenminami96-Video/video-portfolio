<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Portfolio | 南 健一</title>

<style>

body {
  margin: 0;
  background: #fafafa;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 30px;
}

header {
  padding: 60px 0 90px;
}

h1 {
  font-size: 56px;
  letter-spacing: 0.02em;
  margin-bottom: 35px;
}

h2 {
  font-size: 24px;
  margin-bottom: 15px;
}

p {
  line-height: 1.8;
  color: #555;
}

.lead {
  font-size: 18px;
  line-height: 2;
  color: #666666;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.25em;
  color: #888888;
  margin-bottom: 28px;
}
  
/* 動画一覧 */

.works {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 60px 40px;
}


.video {
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.04);
}

.video iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
}


.video h2 {
  margin: 20px 25px 10px;
}

.video p {
  margin: 0 25px 25px;
}


/* スマホ対応 */

@media(max-width:700px){

.container {
  padding: 50px 20px;
}

h1 {
  font-size: 36px;
}

.works {
  grid-template-columns: 1fr;
}

}

</style>

</head>
